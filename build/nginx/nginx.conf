# Top-level config for the dev docker-compose nginx.
#
# The staging/prod equivalent is salt/nginx/etc/nginx/base-nginx.conf, rendered
# from salt/nginx/macros.jinja2 (nginx_head_common + nginx_http_common +
# nginx_log_formats). This file deliberately drops the parts nginx:alpine cannot
# do, because that image ships no njs module:
#
#   load_module modules/ngx_http_js_module.so
#   js_import utils.js;  js_set $headers_json utils.headers_to_json;
#   log_format custom_json ...   (it interpolates $headers_json)
#
# That is why NGINX_MAIN_CONF is the one mount in docker-compose.yml that cannot
# be repointed at the salt-managed host file. Containerising staging would need
# either this file or a Dockerfile adding nginx-module-njs.
#
# Access and error logs stay on the image's /dev/stdout and /dev/stderr symlinks
# so `docker compose logs nginx` is the debugging surface.

worker_processes  auto;
error_log  /var/log/nginx/error.log  info;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include             /etc/nginx/mime.types;
  default_type        application/octet-stream;
  sendfile            on;
  tcp_nopush          on;
  tcp_nodelay         on;
  keepalive_timeout   65;
  types_hash_max_size 2048;
  server_tokens       off;

  # Matches nginx_http_common(). conf.d/hydra.conf relies on this for the
  # `location /` try_files; the .well-known locations set their own root/alias.
  root                /var/www/html;
  client_max_body_size 100M;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  '"$http_x_forwarded_for" "$proxy_host" "$host"';
  access_log /var/log/nginx/access.log main;

  include /etc/nginx/conf.d/*.conf;
}
