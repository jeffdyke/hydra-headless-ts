# DEV ONLY. Derived from build/nginx/reference/hydra.conf.staging.example, which
# is a render of /src/salt/salt/hydra-headless-ts/etc/nginx/conf.d/hydra.conf.
#
# These two files are two copies of the same routing rules. Every intentional
# difference is enumerated in scripts/check-nginx-drift.sh; run it
# (npm run check:nginx-drift) after touching either side. Everything NOT listed
# there is meant to be identical -- keep it that way.
#
# Deliberately absent, because the salt template does not have them either:
#   proxy_http_version 1.1 / proxy_buffering off  (MCP streamable HTTP)
#   Access-Control-Expose-Headers: Mcp-Session-Id, WWW-Authenticate
# If SSE stalls or a browser MCP client cannot read the session header, fix the
# salt template first and mirror it here, so the two do not diverge.

# Which protected resource a request belongs to, for the auth_request gate.
#
# This MUST be a map, not `set`. nginx runs the rewrite phase again for the
# auth_request subrequest, and a server-scope `set $mcp_resource ""` therefore
# re-executes and wipes the value the gated location had set -- /_authz then
# received an empty X-MCP-Resource, authz-fp.ts refused to guess an allowlist and
# returned 403, and because `error_page 401` never fired the client got a bare
# 403 with no WWW-Authenticate challenge and no way to discover where to log in.
#
# A map is evaluated lazily, where it is referenced, so it is not affected by the
# subrequest's rewrite phase. $request_uri is the right key because it keeps the
# ORIGINAL client URI inside the subrequest -- which is exactly why /_authz's
# existing X-Original-URI header worked while X-MCP-Resource did not.
#
# Adding a gated resource means adding a line here AND the matching location.
map $request_uri $mcp_resource {
  default        "";
  ~^/db-tools/example  "example";
}

# T1: staging points every upstream at the VPC address of the active LB
# (10.1.2.247). Here they are compose service names on hydra-net. The upstream
# NAMES are unchanged so the drift check can compare them as a set.
upstream public_api {
  server hydra:4444;
}
upstream admin_api {
  server hydra:4445;
}

# T9 (dev only): there are deliberately no `upstream mcp-tools` /
# `upstream mcp-tools-healthcheck` blocks. mariadb-mcp builds its MariaDB pool
# eagerly and exits(1) with no reachable database, and nginx resolves every
# `upstream ... server <name>` at CONFIG LOAD -- so on a workstation without a
# database nginx would refuse to start at all ("host not found in upstream"),
# taking the /db-compare gate down with an unrelated service. Those two locations
# resolve at request time instead and return 502 while mariadb-mcp is down.
# scripts/check-nginx-drift.sh normalises this back to the canonical form.

upstream hydra-headless-ts {
  server headless-ts:3000;
}


server {
  # T2: staging is `listen 8888 proxy_protocol` because HAProxy fronts it and
  # supplies the PROXY preamble. Nothing does locally, and with proxy_protocol on
  # nginx rejects every connection that lacks one -- a total failure whose error
  # ("broken header") never mentions the cause.
  listen 8888 default_server;
  # Docker's embedded DNS, for the request-time upstream resolution in T9.
  resolver 127.0.0.11 ipv6=off valid=10s;
  # T3: dev is reached as localhost / 127.0.0.1, so accept any Host rather than
  # pinning oauth.<env>.bondlink.org. Also documents that name-based routing is
  # not part of the local setup.
  server_name _;
  add_header 'Access-Control-Allow-Credentials' 'true';
  # T4: $http_host, not $host -- $host drops the port, so on :8888 this redirect
  # would send the client to http://localhost/... (port 80, nothing listening).
  location ~ ^(.+)/$ {
    return 301 $scheme://$http_host$1;
  }

  location ~ ^/(admin|clients|keys|health|metrics|version|oauth2/auth/requests|oauth2/introspect|oauth2/flush) {
    include /etc/nginx/cors_headers;
    include /etc/nginx/options_request;
    proxy_pass http://admin_api;
    proxy_redirect    off;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header  Host               $host;
    proxy_set_header  X-Real-IP          $remote_addr;
    # T5: staging forwards $http_x_forwarded_proto, which HAProxy sets. Locally
    # that header is absent, so the app (app.set('trust proxy', 1)) would compute
    # absolute URLs and cookie `secure` flags from an empty value.
    proxy_set_header  X-Forwarded-Proto  $scheme;
    proxy_set_header X-CSRF-TOKEN $http_x_csrf_token;
    proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
  }

  location = /.well-known/oauth-authorization-server {
   include /etc/nginx/cors_headers;
   include /etc/nginx/options_request;
   proxy_pass http://public_api/.well-known/openid-configuration;
  }
  # oauth2/auth and oauth2/token && oauth2/register are managed by hydra-headless-ts
  # the former is proxied to hydra, the latter is all in the application
  location ~ ^/(.well-known|oauth2/sessions|oauth2/revoke|oauth2/fallbacks/consent|oauth2/fallbacks/error|userinfo) {
    include /etc/nginx/cors_headers;
    include /etc/nginx/options_request;
    proxy_pass http://public_api;
    proxy_set_header Cookie $http_cookie;
    # T6: staging pins the literal auth.staging.bondlink.org here. Doing that in
    # dev makes Hydra mint staging URLs for a request that arrived at localhost.
    # $http_host preserves host AND port, unlike $host.
    proxy_set_header  Host              $http_host;
    proxy_set_header  X-Real-IP         $remote_addr;
    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_set_header X-CSRF-TOKEN $http_x_csrf_token;
    proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
  }

  location = /.well-known/oauth-protected-resource {
    include /etc/nginx/cors_headers;
    include /etc/nginx/options_request;
    alias /var/www/html/auth/.well-known/oauth-protected-resource/index.json;
    add_header Content-Type application/json;
  }

  # T7: staging also has `location /hostname` and `/hostname.html` here, emitted
  # by salt's static_ops_urls() with `add_header X-HAProxy-Force-Backend
  # <minion-id>`. Both are dropped in dev: there is no HAProxy to steer, and
  # /var/www/html/hostname.html is generated on the instance by salt, so they
  # would only ever 404.

  location = /.well-known/oauth-protected-resource/db-tools {
    include /etc/nginx/cors_headers;
    include /etc/nginx/options_request;
    root /var/www/html/auth;
    try_files $uri.json $uri =404;
    add_header Content-Type application/json;
  }

  location = /.well-known/oauth-protected-resource/example {
    include /etc/nginx/cors_headers;
    include /etc/nginx/options_request;
    root /var/www/html/auth;
    try_files $uri.json $uri =404;
    add_header Content-Type application/json;
  }

  location / {
    include /etc/nginx/cors_headers;
    include /etc/nginx/options_request;
    try_files $uri $uri/ @hydra-headless-ts;
  }

  location @hydra-headless-ts {
    proxy_pass http://hydra-headless-ts;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header  Host              $http_host;
    proxy_set_header  X-Real-IP         $remote_addr;
    proxy_set_header  X-Forwarded-Proto $scheme;
    proxy_set_header X-CSRF-TOKEN $http_x_csrf_token;
    proxy_set_header X-XSRF-TOKEN $http_x_xsrf_token;
  }
  # No `set $mcp_resource ""` here: the map above both defines the variable (so
  # nginx cannot reject the config with "unknown variable" when no backend opts
  # in) and supplies the empty default, without being reset by the subrequest.

  location = /_authz {
    internal;
    proxy_pass http://hydra-headless-ts/authz;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-MCP-Resource $mcp_resource;
    proxy_set_header Authorization $http_authorization;
  }
  location @mcp_unauthorized {
    add_header 'Access-Control-Allow-Origin' "$http_origin" always;
    add_header 'Vary' 'Origin' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    # T8: staging hardcodes https://$host. Over plain http on :8888 that sends an
    # MCP client to https://localhost/.well-known/... -- wrong scheme AND wrong
    # port -- so discovery fails before the OAuth flow starts, with a symptom
    # inside the client that never mentions nginx. $scheme://$http_host is
    # correct in both environments; salt only gets away with the literal because
    # staging is https on 443.
    add_header 'WWW-Authenticate' 'Bearer resource_metadata="$scheme://$http_host/.well-known/oauth-protected-resource/$mcp_resource"' always;
    return 401;
  }

  # T9 (dev only): mariadb-mcp builds its MariaDB connection pool eagerly at
  # startup and exits(1) when the database is unreachable -- the normal state on
  # a workstation with no local MariaDB. nginx resolves every
  # `upstream ... server <name>` at CONFIG LOAD, so a stopped mariadb-mcp made
  # nginx itself refuse to start ("host not found in upstream"), taking the whole
  # proxy down with it.
  #
  # Resolving at request time confines the blast radius: /db-tools returns 502
  # while mariadb-mcp is down and everything else keeps serving. 127.0.0.11 is
  # Docker's embedded DNS.
  #
  # Caveat of the variable form: with a variable in proxy_pass, nginx does NOT
  # do prefix replacement -- every request under this location is sent to /mcp
  # exactly, where the plain `proxy_pass http://mcp-tools/mcp` staging uses would
  # map /db-tools/<x> to /mcp/<x>. MCP clients POST to the endpoint itself and
  # never use a sub-path, so this is equivalent in practice, but do not add one.
  location /db-tools {
    include /etc/nginx/cors_headers;
    include /etc/nginx/options_request;
    set $mcp_tools_upstream "mariadb-mcp:9001";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://$mcp_tools_upstream/mcp;
  }

  # Named connection, gated (unlike /db-tools above) -- one mariadb-mcp
  # instance per servers-pillar node flagged mcp_auth_db: true on real infra
  # (docker-compose.mariadb-mcp.dev.yml's mariadb-mcp-example service here).
  # Same T9 request-time resolution as /db-tools: this instance connects
  # eagerly too and can crash-loop the same way.
  location /db-tools/example {
    include /etc/nginx/cors_headers;
    include /etc/nginx/options_request;
    # $mcp_resource comes from the map at the top of this file, not a `set` --
    # see the note there for why a set cannot work with auth_request.
    auth_request /_authz;
    error_page 401 = @mcp_unauthorized;
    set $mcp_tools_example_upstream "mariadb-mcp-example:9001";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://$mcp_tools_example_upstream/mcp;
  }

  # Shadowed in practice: the `~ ^/(admin|clients|keys|health|...)` location
  # above matches /healthcheck via ^/health and wins, so this never runs. Kept
  # so the dev conf mirrors what salt renders; see the note in
  # pillar/base/hydra-headless-ts.
  location /healthcheck {
    include /etc/nginx/cors_headers;
    include /etc/nginx/options_request;
    set $mcp_tools_healthcheck_upstream "mariadb-mcp:9001";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://$mcp_tools_healthcheck_upstream/mcp;
  }

  # NB: this regex is unanchored on the right, so /authz matches ^/auth and
  # reaches the app's authorization endpoint without a location of its own.
  # scripts/validate-mcp-path.sh relies on that.
  location ~ ^/(consent|logout|auth|callback|oauth2) {
    include /etc/nginx/cors_headers;
    include /etc/nginx/options_request;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    chunked_transfer_encoding on;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_pass http://hydra-headless-ts;
  }

}
