# DEV SAMPLE -> copy to /etc/hydra-headless-ts/dbhub.toml
#
# Staging and prod render this from salt/dbhub/dbhub.toml.jinja2, one [[sources]]
# block per host resolved from the VPC topology cache. This sample has a single
# source so the local stack starts; edit host/user for whatever you can reach.
#
# The `id` becomes the tool-name suffix an MCP client sees -- execute_sql_localdb,
# search_objects_localdb -- so a tool call says which host it hit.
#
# DBHub reads this file ONCE at startup, so a change needs a recreate, not a
# restart:  docker compose up -d --force-recreate dbhub

[[sources]]
id = "localdb"
description = "local dev database"
type = "mariadb"
host = "host.docker.internal"
port = 3306
database = "BondLink"
user = "claude-mariadb"
# Resolved from dbhub.env at load time; never stored in this file.
password = "${DBHUB_DB_PASSWORD}"
charset = "utf8mb4"
# Load-bearing for dev: connect on first use, not at startup. DBHub therefore
# starts and answers tools/list even with no reachable database, so
# scripts/validate-mcp-path.sh stages 1-4 pass and only stage 5 fails -- which
# is exactly the diagnostic you want when the database is the broken part.
lazy = true
connection_timeout = 10
query_timeout = 30

# Declared explicitly rather than relying on DBHub's per-source built-ins: this is
# what pins readonly/max_rows and keeps the exposed tool surface reviewable here.
[[tools]]
name = "execute_sql"
source = "localdb"
readonly = true
max_rows = 1000

[[tools]]
name = "search_objects"
source = "localdb"
