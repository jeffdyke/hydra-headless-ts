
name: hydra
volumes:
  postgres-data:

# Shared shape for every mariadb-mcp instance (the default below plus one per
# named source in a service like mariadb-mcp-<name>). One image, N containers --
# the image takes no per-instance build arg (connection config is 100% runtime
# env), so this anchor exists only to avoid repeating image/build/volumes/
# networks/restart per instance. Each instance service only needs to set
# container_name, env_file and ports.
x-mariadb-mcp: &mariadb-mcp-base
  image: 668874212870.dkr.ecr.us-east-1.amazonaws.com/bondlink-mariadb-mcp:latest
  build:
    context: .
    dockerfile: build/Dockerfile.mariadb-mcp
    platforms:
      - linux/amd64
      - linux/arm64
  volumes:
    - /var/log/bondlink:/var/log/bondlink
    - /etc/hydra-headless-ts:/etc/hydra-headless-ts:ro
  networks:
    - hydra-net
  restart: unless-stopped

services:
  hydra-migrate:
    image: oryd/hydra:v25.4.0-arm64
    environment:
      - DSN=postgres://hydra:my-super-secret-password@postgres:5432/hydra?sslmode=disable
    command: migrate sql -e --yes
    restart: on-failure
    depends_on:
      - postgres
    networks:
      - hydra-net

  hydra:
    image: oryd/hydra:v25.4.0-arm64
    ports:
      - "4444:4444" # Public API
      - "4445:4445" # Admin API
    logging:
      driver: json-file
      options:
        tag: hydra
    command: serve all --dev --config /etc/hydra-headless-ts/hydra.yml
    restart: unless-stopped
    volumes:
      - /var/log/hydra-headless-ts:/var/log/hydra-headless-ts
      - /etc/hydra-headless-ts:/etc/hydra-headless-ts:ro
      - /var/www/html:/var/www/html:ro
    depends_on:
      - hydra-migrate
    networks:
      - hydra-net
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=hydra
      - POSTGRES_PASSWORD=my-super-secret-password
      - POSTGRES_DB=hydra
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-session-table.sql:/docker-entrypoint-initdb.d/01-init-session-table.sql:ro
    networks:
      - hydra-net
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis
    ports:
      - 6379:6379
    networks:
      - hydra-net
  headless-ts:
    image: 668874212870.dkr.ecr.us-east-1.amazonaws.com/bondlink-hydra-headless-ts
    env_file:
      - /etc/hydra-headless-ts/hydra.env
    ports:
      - "3000:3000"
    build:
      context: .
      dockerfile: build/Dockerfile.headless-ts
      platforms:
        - linux/amd64
        - linux/arm64
      args:
        - GIT_BRANCH=${GIT_BRANCH}
      # Replaces the old GIT_TOKEN build-arg: a build-arg is recorded verbatim
      # in `docker history`, so the token travelled with the image. build/
      # rebuild.sh writes the askpass script and exports GIT_ASKPASS_FILE.
      secrets:
        - github_askpass
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_ENV=development
    depends_on:
      - hydra
    networks:
      - hydra-net
    restart: unless-stopped
    volumes:
      - /var/log/hydra-headless-ts:/var/log/hydra-headless-ts
      - /etc/hydra-headless-ts:/etc/hydra-headless-ts:ro
  # Default/legacy instance: still the ungated bare /db-tools alias (unlike the
  # named instances below, which are gated -- see build/nginx/dev/conf.d/hydra.conf).
  mariadb-mcp:
    <<: *mariadb-mcp-base
    container_name: mariadb-mcp
    env_file: /etc/hydra-headless-ts/mariadb-mcp.env
    ports:
      - "9001:9001"

  # Named connection, gated at /db-tools/staging-db-galera-prime. One of N
  # sources from pillar mariadb-mcp:sources (salt/mariadb-mcp/init.sls renders
  # one env file per entry); add another service the same shape for each
  # additional source, changing only container_name/env_file/ports.
  #
  # Every mariadb-mcp container listens on 9001 INSIDE the container --
  # build/Dockerfile.mariadb-mcp's ENTRYPOINT hardcodes --port 9001, it isn't
  # configurable per-instance. Only the published HOST port varies (9003 here,
  # matching pillar mariadb-mcp:sources[].port on the salt side, which staging/
  # prod's host nginx uses directly since it isn't on hydra-net). nginx in this
  # compose file reaches it by service name on the container's real port
  # (mariadb-mcp-staging-db-galera-prime:9001), never through 9003.
  mariadb-mcp-staging-db-galera-prime:
    <<: *mariadb-mcp-base
    container_name: mariadb-mcp-staging-db-galera-prime
    env_file: /etc/hydra-headless-ts/mariadb-mcp-staging-db-galera-prime.env
    ports:
      - "9003:9001"

  # Dev only. Staging and prod are served by the HOST nginx that salt manages
  # (salt/hydra-headless-ts -> /etc/nginx/conf.d/hydra.conf); this service exists
  # so the auth_request gate, the CORS fragments and the .well-known documents can
  # be exercised locally instead of only on a deployed instance.
  #
  # Every mount is an env var so pointing this at a salt-rendered host tree later
  # is one line per mount -- see build/nginx/README.md for the table. The one
  # exception is NGINX_MAIN_CONF: salt's nginx.conf load_module's njs, which this
  # image does not ship.
  #
  # nginx resolves `upstream ... server <name>` at CONFIG LOAD, so if a backend is
  # down nginx refuses to start with "host not found in upstream" rather than
  # failing per-request. restart: unless-stopped retries until they exist.
  nginx:
    image: nginx:alpine
    container_name: hydra-nginx
    ports:
      - "8888:8888"
    profiles:
      - dev
    volumes:
      # conf.d is mounted as a DIRECTORY on purpose: it shadows the stock image's
      # conf.d/default.conf, which would otherwise also bind a server on :80.
      - ${NGINX_CONF_DIR:-./build/nginx/dev/conf.d}:/etc/nginx/conf.d:ro
      - ${NGINX_MAIN_CONF:-./build/nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      # Individual files, not a directory: mounting over /etc/nginx would hide
      # mime.types, fastcgi_params and friends that ship in the image.
      - ${NGINX_ETC_DIR:-./build/nginx/shared}/cors_headers:/etc/nginx/cors_headers:ro
      - ${NGINX_ETC_DIR:-./build/nginx/shared}/options_request:/etc/nginx/options_request:ro
      - ${NGINX_WWW_DIR:-./build/nginx/www}:/var/www/html:ro
    # No /var/log/nginx mount: the image symlinks access.log -> /dev/stdout and
    # error.log -> /dev/stderr, and bind-mounting over them loses
    # `docker compose logs nginx`, which is the whole local debugging surface.
    depends_on:
      - hydra
      - headless-ts
      - mariadb-mcp
      - mariadb-mcp-staging-db-galera-prime
    networks:
      - hydra-net
    restart: unless-stopped
networks:
  hydra-net:
    driver: bridge

# Build-time only, consumed by build/Dockerfile.headless-ts's `--mount=type=secret`.
# build/rebuild.sh generates the script from $GIT_TOKEN and exports the path.
# Defaults to /dev/null so `compose up`/`compose config` still resolve for the
# services that never build headless-ts; a build that reaches the clone without
# a real script fails with a plain git auth error rather than something cryptic.
secrets:
  github_askpass:
    file: ${GIT_ASKPASS_FILE:-/dev/null}
