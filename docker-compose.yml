
name: hydra
volumes:
  postgres-data:

# Shared shape for every mariadb-mcp instance (the default below plus one per
# named source in a service like mariadb-mcp-<name>). One image, N containers --
# the image takes no per-instance build arg (connection config is 100% runtime
# env), so this anchor exists only to avoid repeating image/build/volumes/
# networks/restart per instance. Each instance service only needs to set
# container_name, env_file and ports.
x-mariadb-mcp: &mariadb-mcp-base
  # :latest is oddjob/drone/build.sh's amd64 tag (no arch suffix, by that
  # script's own convention) and has not been pushed since the amd64 fleet
  # migration completed -- :latest-arm64 is the tag its arm64-only pipeline
  # actually keeps current now that the build above is arm64-only too.
  image: 668874212870.dkr.ecr.us-east-1.amazonaws.com/bondlink-mariadb-mcp:latest-arm64
  build:
    context: .
    dockerfile: build/Dockerfile.mariadb-mcp
    platforms:
      - linux/arm64
  volumes:
    - /var/log/bondlink:/var/log/bondlink
    - /etc/hydra-headless-ts:/etc/hydra-headless-ts:ro
  networks:
    - hydra-net
  restart: unless-stopped

services:
  hydra-migrate:
    image: oryd/hydra:v25.4.0-arm64
    environment:
      - DSN=postgres://hydra:my-super-secret-password@postgres:5432/hydra?sslmode=disable
    command: migrate sql -e --yes
    restart: on-failure
    depends_on:
      - postgres
    networks:
      - hydra-net

  hydra:
    image: oryd/hydra:v25.4.0-arm64
    ports:
      - "4444:4444" # Public API
      - "4445:4445" # Admin API
    logging:
      driver: json-file
      options:
        tag: hydra
    command: serve all --dev --config /etc/hydra-headless-ts/hydra.yml
    restart: unless-stopped
    volumes:
      - /var/log/hydra-headless-ts:/var/log/hydra-headless-ts
      - /etc/hydra-headless-ts:/etc/hydra-headless-ts:ro
      - /var/www/html:/var/www/html:ro
    depends_on:
      - hydra-migrate
    networks:
      - hydra-net
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=hydra
      - POSTGRES_PASSWORD=my-super-secret-password
      - POSTGRES_DB=hydra
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-session-table.sql:/docker-entrypoint-initdb.d/01-init-session-table.sql:ro
    networks:
      - hydra-net
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis
    ports:
      - 6379:6379
    networks:
      - hydra-net
  headless-ts:
    image: 668874212870.dkr.ecr.us-east-1.amazonaws.com/bondlink-hydra-headless-ts
    env_file:
      - /etc/hydra-headless-ts/hydra.env
    ports:
      - "3000:3000"
    build:
      context: .
      dockerfile: build/Dockerfile.headless-ts
      platforms:
        - linux/arm64
      args:
        - GIT_BRANCH=${GIT_BRANCH}
      # Replaces the old GIT_TOKEN build-arg: a build-arg is recorded verbatim
      # in `docker history`, so the token travelled with the image. build/
      # rebuild.sh writes the askpass script and exports GIT_ASKPASS_FILE.
      secrets:
        - github_askpass
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - NODE_ENV=development
    depends_on:
      - hydra
    networks:
      - hydra-net
    restart: unless-stopped
    volumes:
      - /var/log/hydra-headless-ts:/var/log/hydra-headless-ts
      - /etc/hydra-headless-ts:/etc/hydra-headless-ts:ro
  # Template for every mariadb-mcp instance -- the default `mariadb-mcp` plus
  # one per servers-pillar node flagged mcp_auth_db: true (salt/mariadb-mcp/
  # init.sls renders one env file per instance). Neither is declared here:
  # which instances actually exist varies per environment (staging/prod have
  # different node counts, and a default instance is not guaranteed to exist
  # -- see pillar/<env>/servers/init.sls's mcp_default_db flag and
  # pillar/base/mariadb-mcp's max_mcp_server cap, both in the salt repo), so
  # real service blocks live in a docker-compose.mariadb-mcp.<env>.yml, each
  # `extends:`ing this one and setting only container_name/env_file/ports.
  # For staging/prod that file is rendered directly onto the minion by
  # salt/hydra-headless-ts/init.sls (salt repo), at /etc/hydra-headless-ts/
  # docker-compose.mariadb-mcp.<env>.yml -- nothing here commits or checks a
  # copy of it; ci/generate_mariadb_mcp_compose.py (salt repo) previews the
  # same shape from static pillar for when there's no live minion to render
  # against, and `sudo /etc/init.d/hydra-mcp start` on the minion is what
  # starts the rendered stack. docker-compose.mariadb-mcp.dev.yml is the
  # hand-maintained equivalent for local dev, which has no Salt to render one.
  #
  # Exists only as an `extends:` target -- every real invocation always passes
  # both `-f docker-compose.yml` and an env's `-f docker-compose.mariadb-mcp.
  # <env>.yml`, so this is never started on its own in practice. It has no
  # `profiles:` guard: this Compose version (verified empirically) drops the
  # whole `extends:` chain -- silently, no error -- for any service that
  # extends a profile-gated target not in the active profile set, which broke
  # every real instance rather than just excluding this template. A bare
  # `docker compose up` with no service names DOES start this (verified) since
  # nothing marks it inactive -- it immediately fails with no env_file (no
  # DB_HOST/DB_PASSWORD), so `restart: "no"` overrides the anchor's
  # `unless-stopped` here specifically: it exits once and stays Exited rather
  # than cycling Restarting forever in `docker compose ps`.
  #
  # Every mariadb-mcp container listens on 9001 INSIDE the container --
  # build/Dockerfile.mariadb-mcp's ENTRYPOINT hardcodes --port 9001, it isn't
  # configurable per-instance. Only the published HOST port varies per
  # instance (see whichever docker-compose.mariadb-mcp.*.yml is in play).
  mariadb-mcp-base:
    <<: *mariadb-mcp-base
    restart: "no"

  # Dev only. Staging and prod are served by the HOST nginx that salt manages
  # (salt/hydra-headless-ts -> /etc/nginx/conf.d/hydra.conf); this service exists
  # so the auth_request gate, the CORS fragments and the .well-known documents can
  # be exercised locally instead of only on a deployed instance.
  #
  # Every mount is an env var so pointing this at a salt-rendered host tree later
  # is one line per mount -- see build/nginx/README.md for the table. The one
  # exception is NGINX_MAIN_CONF: salt's nginx.conf load_module's njs, which this
  # image does not ship.
  #
  # nginx resolves `upstream ... server <name>` at CONFIG LOAD, so if a backend is
  # down nginx refuses to start with "host not found in upstream" rather than
  # failing per-request. restart: unless-stopped retries until they exist.
  nginx:
    image: nginx:alpine
    container_name: hydra-nginx
    ports:
      - "8888:8888"
    profiles:
      - dev
    volumes:
      # conf.d is mounted as a DIRECTORY on purpose: it shadows the stock image's
      # conf.d/default.conf, which would otherwise also bind a server on :80.
      - ${NGINX_CONF_DIR:-./build/nginx/dev/conf.d}:/etc/nginx/conf.d:ro
      - ${NGINX_MAIN_CONF:-./build/nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      # Individual files, not a directory: mounting over /etc/nginx would hide
      # mime.types, fastcgi_params and friends that ship in the image.
      - ${NGINX_ETC_DIR:-./build/nginx/shared}/cors_headers:/etc/nginx/cors_headers:ro
      - ${NGINX_ETC_DIR:-./build/nginx/shared}/options_request:/etc/nginx/options_request:ro
      - ${NGINX_WWW_DIR:-./build/nginx/www}:/var/www/html:ro
    # No /var/log/nginx mount: the image symlinks access.log -> /dev/stdout and
    # error.log -> /dev/stderr, and bind-mounting over them loses
    # `docker compose logs nginx`, which is the whole local debugging surface.
    depends_on:
      - hydra
      - headless-ts
      # mariadb-mcp instance names vary per environment/fragment (see
      # mariadb-mcp-base's comment above), so they aren't listed here --
      # docker-compose.mariadb-mcp.dev.yml adds its own depends_on entries
      # for this same `nginx` service, which Compose merges (does not
      # replace) with this list when both files are passed to `-f`.
    networks:
      - hydra-net
    restart: unless-stopped
networks:
  hydra-net:
    driver: bridge

# Build-time only, consumed by build/Dockerfile.headless-ts's `--mount=type=secret`.
# build/rebuild.sh generates the script from $GIT_TOKEN and exports the path.
# Defaults to /dev/null so `compose up`/`compose config` still resolve for the
# services that never build headless-ts; a build that reaches the clone without
# a real script fails with a plain git auth error rather than something cryptic.
secrets:
  github_askpass:
    file: ${GIT_ASKPASS_FILE:-/dev/null}
